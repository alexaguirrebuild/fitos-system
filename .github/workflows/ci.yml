name: CI

# Lo mismo que hay que pasar en local antes de pedir revisión: tipos, lint, tests y build.
# Sin secretos: los tests corren sobre PGlite (Postgres embebido) y el build no toca la base.
# Solo en push: los PR del mismo repo ya muestran el resultado del push de su rama (con pull_request correría dos veces).
on:
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Acciones fijadas por SHA (v7.0.1 y v7.1.0, comprobadas el 22-nov-2026): una etiqueta se puede mover, un SHA no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json # engines.node: la misma versión que Vercel en producción
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  # Los 5 flujos diarios con Playwright sobre la app compilada y una PGlite nueva (e2e/fixture.mts). Sin secretos.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      # v6.1.0 comprobada el 22-nov-2026.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium y sus dependencias del sistema
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: E2E
        run: npm run e2e
      # v7.0.2 comprobada el 22-nov-2026. Trazas y capturas solo si algo falla.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-informe
          path: |
            playwright-report/
            test-results/
          retention-days: 7
